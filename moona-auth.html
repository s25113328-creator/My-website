<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moona - Authentication</title>
  <style>
    :root {
      --transition-speed: 0.3s;
    }

    [data-theme="light"] {
      --primary-brown: #6f4e37;
      --soft-pink: #ffb7b2;
      --bg-cream: #fffaf6;
      --card-bg: #ffffff;
      --text-muted: #a68975;
      --border-color: #d4c4b5;
      --input-bg: #faf5f0;
      --moon-bg: #6f4e37;
      --moon-shadow: inset -18px 0 0 4px var(--soft-pink);
      --moon-glow: none;
    }

    [data-theme="dark"] {
      --primary-brown: #dfc5b3;
      --soft-pink: #4a3b5c;
      --bg-cream: #1a1625;
      --card-bg: #252033;
      --text-muted: #9d8fa9;
      --border-color: #3d3650;
      --input-bg: #1e1a2a;
      --moon-bg: #f5e6a3;
      --moon-shadow: none;
      --moon-glow: 0 0 30px 10px rgba(245, 230, 163, 0.4), 0 0 60px 20px rgba(245, 230, 163, 0.2);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-cream);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background-color var(--transition-speed);
      overflow: hidden;
    }

    #backdrop-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .login-card {
      background: var(--card-bg);
      border: 2px dashed var(--border-color);
      border-radius: 24px;
      padding: 40px;
      max-width: 400px;
      width: 90%;
      position: relative;
      z-index: 10;
      transition: background-color var(--transition-speed), border-color var(--transition-speed);
    }

    .theme-toggle {
      position: absolute;
      top: 16px;
      right: 16px;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      transition: all var(--transition-speed);
    }

    .theme-toggle:hover {
      transform: scale(1.1);
    }

    .moon-container {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
      position: relative;
    }

    .moon-icon {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: var(--moon-bg);
      box-shadow: var(--moon-shadow), var(--moon-glow);
      transition: all var(--transition-speed);
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h1 {
      font-family: Georgia, 'Times New Roman', Times, serif;
      font-size: 2.5rem;
      color: var(--primary-brown);
      margin-bottom: 8px;
      transition: color var(--transition-speed);
    }

    .header p {
      font-style: italic;
      color: var(--text-muted);
      font-size: 0.95rem;
      transition: color var(--transition-speed);
    }

    .tabs {
      display: flex;
      margin-bottom: 25px;
      border-radius: 12px;
      overflow: hidden;
      background: var(--input-bg);
      padding: 4px;
      transition: background-color var(--transition-speed);
    }

    .tab-btn {
      flex: 1;
      padding: 12px 20px;
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text-muted);
      border-radius: 10px;
      transition: all var(--transition-speed);
    }

    .tab-btn.active {
      background: var(--card-bg);
      color: var(--primary-brown);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .tab-btn:hover:not(.active) {
      color: var(--primary-brown);
    }

    .input-group {
      margin-bottom: 18px;
    }

    .input-group label {
      display: block;
      margin-bottom: 6px;
      color: var(--primary-brown);
      font-size: 0.9rem;
      font-weight: 500;
      transition: color var(--transition-speed);
    }

    .input-group input,
    .input-group select {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      font-size: 1rem;
      background: var(--input-bg);
      color: var(--primary-brown);
      transition: all var(--transition-speed);
      outline: none;
    }

    .input-group input:focus,
    .input-group select:focus {
      border-color: var(--primary-brown);
      box-shadow: 0 0 0 3px rgba(111, 78, 55, 0.1);
    }

    .input-group input::placeholder {
      color: var(--text-muted);
    }

    .password-container {
      position: relative;
    }

    .forgot-link {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--soft-pink);
      font-size: 0.85rem;
      text-decoration: none;
      cursor: pointer;
      transition: color var(--transition-speed);
    }

    [data-theme="light"] .forgot-link {
      color: #e8948e;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    #previousAccountsContainer {
      display: none;
    }

    #previousAccountsContainer.visible {
      display: block;
    }

    #birthdayInputGroup {
      display: none;
      overflow: hidden;
      transition: all var(--transition-speed);
    }

    #birthdayInputGroup.visible {
      display: block;
    }

    .submit-btn {
      width: 100%;
      padding: 14px 20px;
      background: var(--primary-brown);
      color: var(--card-bg);
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition-speed);
      margin-top: 10px;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(111, 78, 55, 0.25);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    .divider {
      display: flex;
      align-items: center;
      margin: 25px 0;
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border-color);
    }

    .divider span {
      padding: 0 15px;
    }

    .social-login {
      display: flex;
      gap: 12px;
    }

    .social-btn {
      flex: 1;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      background: var(--input-bg);
      cursor: pointer;
      font-size: 1.2rem;
      transition: all var(--transition-speed);
    }

    .social-btn:hover {
      border-color: var(--primary-brown);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <canvas id="backdrop-canvas"></canvas>

  <div class="login-card">
    <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
      <span id="themeIcon">🌙</span>
    </button>

    <div class="moon-container">
      <div class="moon-icon"></div>
    </div>

    <div class="header">
      <h1>Moona</h1>
      <p>Your celestial gateway awaits</p>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="login" onclick="switchTab('login')">Log In</button>
      <button class="tab-btn" data-tab="signup" onclick="switchTab('signup')">Sign Up</button>
    </div>

    <form id="authForm" onsubmit="handleSubmit(event)">
      <div class="input-group" id="previousAccountsContainer">
        <label for="profileSelect">Previous Accounts</label>
        <select id="profileSelect" onchange="selectProfile()">
          <option value="">Select a profile...</option>
        </select>
      </div>

      <div class="input-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Enter your username" required>
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <div class="password-container">
          <input type="password" id="password" placeholder="Enter your password" required style="padding-right: 70px;">
          <a class="forgot-link" id="forgotLink" onclick="handleForgot()">Forgot?</a>
        </div>
      </div>

      <div class="input-group" id="birthdayInputGroup">
        <label for="birthday">Birthday</label>
        <input type="date" id="birthday">
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">Log In</button>
    </form>

    <div class="divider">
      <span>or continue with</span>
    </div>

    <div class="social-login">
      <button type="button" class="social-btn" aria-label="Google login">🌐</button>
      <button type="button" class="social-btn" aria-label="Apple login">🍎</button>
      <button type="button" class="social-btn" aria-label="Twitter login">🐦</button>
    </div>
  </div>

  <script>
    // Theme and animation state
    let currentThemeMode = 'light';
    let currentTab = 'login';
    let particles = [];

    // Canvas setup
    const canvas = document.getElementById('backdrop-canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Particle class
    class Particle {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 15 + 8;
        this.speedY = Math.random() * 0.5 + 0.2;
        this.speedX = (Math.random() - 0.5) * 0.3;
        this.rotation = Math.random() * Math.PI * 2;
        this.rotationSpeed = (Math.random() - 0.5) * 0.02;
        this.opacity = Math.random() * 0.4 + 0.4;
        this.pulseOffset = Math.random() * Math.PI * 2;
      }

      update() {
        this.y += this.speedY;
        this.x += this.speedX;
        this.rotation += this.rotationSpeed;

        if (this.y > canvas.height + 50) {
          this.y = -50;
          this.x = Math.random() * canvas.width;
        }

        if (this.x > canvas.width + 50) this.x = -50;
        if (this.x < -50) this.x = canvas.width + 50;
      }

      drawFlower() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        ctx.globalAlpha = this.opacity;

        // Draw 5-petal flower
        ctx.fillStyle = 'rgba(255, 183, 178, 0.65)';
        for (let i = 0; i < 5; i++) {
          ctx.beginPath();
          ctx.ellipse(0, -this.size * 0.6, this.size * 0.35, this.size * 0.6, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.rotate(Math.PI * 2 / 5);
        }

        // Bright center core
        ctx.beginPath();
        ctx.arc(0, 0, this.size * 0.25, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 220, 200, 0.9)';
        ctx.fill();

        ctx.restore();
      }

      drawStar(time) {
        ctx.save();
        ctx.translate(this.x, this.y);

        // Pulsing effect
        const pulse = Math.sin(time * 0.002 + this.pulseOffset) * 0.3 + 0.7;
        ctx.globalAlpha = this.opacity * pulse;

        // Neon glow effect
        ctx.shadowColor = '#dfc5b3';
        ctx.shadowBlur = 15 * pulse;

        ctx.strokeStyle = 'rgba(223, 197, 179, 0.8)';
        ctx.lineWidth = 2;
        ctx.fillStyle = 'rgba(223, 197, 179, 0.3)';

        // Draw 4-point star burst with quadratic curves
        const points = 4;
        const outerRadius = this.size;
        const innerRadius = this.size * 0.3;

        ctx.beginPath();
        for (let i = 0; i < points; i++) {
          const angle = (i * Math.PI * 2 / points) - Math.PI / 2 + this.rotation;
          const nextAngle = ((i + 1) * Math.PI * 2 / points) - Math.PI / 2 + this.rotation;
          const midAngle = angle + Math.PI / points;

          const outerX = Math.cos(angle) * outerRadius;
          const outerY = Math.sin(angle) * outerRadius;
          const innerX = Math.cos(midAngle) * innerRadius;
          const innerY = Math.sin(midAngle) * innerRadius;
          const nextOuterX = Math.cos(nextAngle) * outerRadius;
          const nextOuterY = Math.sin(nextAngle) * outerRadius;

          if (i === 0) {
            ctx.moveTo(outerX, outerY);
          }

          ctx.quadraticCurveTo(innerX, innerY, nextOuterX, nextOuterY);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.restore();
      }
    }

    // Initialize particles
    for (let i = 0; i < 30; i++) {
      particles.push(new Particle());
    }

    // Animation loop
    function animate(time) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      particles.forEach(particle => {
        particle.update();
        if (currentThemeMode === 'light') {
          particle.drawFlower();
        } else {
          particle.drawStar(time);
        }
      });

      requestAnimationFrame(animate);
    }

    animate(0);

    // Theme toggle
    function toggleTheme() {
      const html = document.documentElement;
      const themeIcon = document.getElementById('themeIcon');

      if (currentThemeMode === 'light') {
        currentThemeMode = 'dark';
        html.setAttribute('data-theme', 'dark');
        themeIcon.textContent = '☀️';
      } else {
        currentThemeMode = 'light';
        html.setAttribute('data-theme', 'light');
        themeIcon.textContent = '🌙';
      }
    }

    // Tab switching
    function switchTab(tab) {
      currentTab = tab;
      const tabs = document.querySelectorAll('.tab-btn');
      const submitBtn = document.getElementById('submitBtn');
      const birthdayGroup = document.getElementById('birthdayInputGroup');
      const previousAccountsContainer = document.getElementById('previousAccountsContainer');
      const forgotLink = document.getElementById('forgotLink');

      // Clear inputs
      document.getElementById('username').value = '';
      document.getElementById('password').value = '';
      document.getElementById('birthday').value = '';

      // Update tab styles
      tabs.forEach(t => {
        if (t.dataset.tab === tab) {
          t.classList.add('active');
        } else {
          t.classList.remove('active');
        }
      });

      if (tab === 'login') {
        submitBtn.textContent = 'Log In';
        birthdayGroup.classList.remove('visible');
        forgotLink.style.display = 'block';
        loadPreviousAccounts();
      } else {
        submitBtn.textContent = 'Sign Up';
        birthdayGroup.classList.add('visible');
        previousAccountsContainer.classList.remove('visible');
        forgotLink.style.display = 'none';
      }
    }

    // Load previous accounts from localStorage
    function loadPreviousAccounts() {
      const select = document.getElementById('profileSelect');
      const container = document.getElementById('previousAccountsContainer');
      
      // Clear existing options except the first
      select.innerHTML = '<option value="">Select a profile...</option>';

      let accountsFound = false;

      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key && key.startsWith('moona_pass_')) {
          const username = key.replace('moona_pass_', '');
          const option = document.createElement('option');
          option.value = username;
          option.textContent = username;
          select.appendChild(option);
          accountsFound = true;
        }
      }

      if (accountsFound) {
        container.classList.add('visible');
      } else {
        container.classList.remove('visible');
      }
    }

    // Select profile from dropdown
    function selectProfile() {
      const select = document.getElementById('profileSelect');
      const username = select.value;

      if (username) {
        document.getElementById('username').value = username;
        const password = localStorage.getItem('moona_pass_' + username);
        if (password) {
          document.getElementById('password').value = password;
        }
      }
    }

    // Handle forgot password
    function handleForgot() {
      const username = document.getElementById('username').value.trim();

      if (!username) {
        alert('Please enter your username first.');
        return;
      }

      const storedBirthday = localStorage.getItem('moona_bday_' + username);

      if (!storedBirthday) {
        alert('No account found with this username.');
        return;
      }

      const inputBirthday = prompt('Please enter your birthday (YYYY-MM-DD):');

      if (inputBirthday === storedBirthday) {
        const password = localStorage.getItem('moona_pass_' + username);
        document.getElementById('password').value = password;
        alert('Password recovered and auto-filled!');
      } else {
        alert('Birthday does not match our records.');
      }
    }

    // Handle form submission
    function handleSubmit(event) {
      event.preventDefault();

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const birthday = document.getElementById('birthday').value;

      if (!username || !password) {
        alert('Please fill in all required fields.');
        return;
      }

      if (currentTab === 'signup') {
        if (!birthday) {
          alert('Please enter your birthday.');
          return;
        }

        // Save to localStorage
        localStorage.setItem('moona_pass_' + username, password);
        localStorage.setItem('moona_bday_' + username, birthday);

        alert('Account created successfully! Please log in.');
        switchTab('login');
        document.getElementById('username').value = username;
      } else {
        // Login validation
        const storedPassword = localStorage.getItem('moona_pass_' + username);

        if (!storedPassword) {
          alert('No account found with this username.');
          return;
        }

        if (password !== storedPassword) {
          alert('Incorrect password.');
          return;
        }

        // Successful login - keep card visible, just show alert
        alert('Welcome back, ' + username + '! Authentication successful.');
      }
    }

    // Initialize on load
    document.addEventListener('DOMContentLoaded', function() {
      loadPreviousAccounts();
    });
  </script>
</body>
</html>
